- type: entity
  parent: SyndieDuffelGiftBox
  id: ScraptechsGiftBox
  abstract: true
  suffix: NPC Loot
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/leather.rsi
    state: icon

# Tier 1 DT

- type: entity
  parent: ScraptechsGiftBox
  id: ClothingBackpackDT1Vagabound
  name: dust troopers vagabound satchel
  description: an old, leather satchel, contain some helpful things... Maybe...
  components:
  - type: SpawnItemsOnUse
    items:
    # Weapons/ammo
    - id: NFWeaponRifleRepeater
      prob: 0.1
    - id: NFWeaponRifleSVS
      prob: 0.05
    - id: NFMagazineLowCapacityRifle30
      prob: 0.1
    - id: Machete
      prob: 0.2
    - id: NFBaseAmmunitionBoxRifle20
      prob: 0.3
    - id: NFBaseAmmunitionBoxRifle30
      prob: 0.1
    - id: Pickaxe
      prob: 0.3
    # Clothes
    - id: ClothingUniformrobeST
      prob: 0.5
    - id: ClothingShoesLinenwrap
      prob: 0.9
    - id: ClothingNeckScrapCloak
      prob: 0.05
    - id: ClothingMaskBandGreen
      prob: 0.2
    - id: ClothingMaskGas
      prob: 0.3
    # Items
    - id: SpawnDungeonLootMaterialsBasicFull
      prob: 0.1
    - id: DrinkMREFlask
    - id: FoodTinMRE
      prob: 0.4
    - id: MetalFuelCanDieselFuel
      prob: 0.2
    - id: CrowbarYellow
      prob: 0.4
    - id: Lantern
      prob: 0.5
    sound:
      path: /Audio/Items/jumpsuit_equip.ogg

