  description: 160-round belt-box magazine for light machine guns. Intended to hold special ammunition with shotgun-pellets instead of bullet.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePackedShotgun

- type: entity
  id: MagazinePackedLMGExplosive
  suffix: Solarm, explosive
