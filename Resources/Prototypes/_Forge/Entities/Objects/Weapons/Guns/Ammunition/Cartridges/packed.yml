- type: entity
  parent: [ BaseCartridge, BaseC2ContrabandUnredeemable ]
  id: CartridgePacked
  name: cartridge (.22,5 packed)
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgePacked
  - type: CartridgeAmmo
    proto: BulletPacked
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Ammunition/Casings/packed_casing.rsi 
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 2

