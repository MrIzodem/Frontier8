- type: entity
  id: MagazinePackedPistol
  name: pistol magazine (.25,5 packed)
  suffix: DT/ST
  parent: [ BaseItem, BaseC1Contraband, RecyclableItemSteelTiny ]
  abstract: true
  components:
  - type: Tag
    tags:
      - MagazinePackedPistol
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgePacked
    capacity: 12
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Ammunition/Magazine/Packed/packed_pistol_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MagazinePackedHighPistol
  name: extended pistol magazine (.25,5 packed)
  suffix: DT/ST
  parent: [ BaseItem, BaseC2ContrabandUnredeemable, RecyclableItemSteelTiny ]
  abstract: true
  components:
  - type: Tag
    tags:
      - MagazinePackedHighPistol
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgePacked
    capacity: 21
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Ammunition/Magazine/Packed/packed_pistol_high_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 9
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MagazinePackedPistolEmpty
  suffix: DT/ST, empty
  parent: MagazinePackedPistol
  description: 12-round single-stack magazine for pistols.
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
