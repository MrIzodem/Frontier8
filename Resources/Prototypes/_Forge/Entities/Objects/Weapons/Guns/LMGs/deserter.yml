- type: entity
  id: WeaponScrapLightMachineGunDeserter
  parent: [BaseC3Contraband, NFBaseWeaponEncumbranceSniper, NFBaseItemWeaponGunMagazineFed ]
  name: Deserter LMG
  description: Light Machine Gun, maded in base AS-55, famous for its quality and use in elite troops, also can accept drum magazines on 64-st bullets. Use .22,5 packed ammo.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/LMGs/Deserter_icon_45x.rsi
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/LMGs/Deserter.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item
    sprite: Forge/Objects/Weapons/Guns/LMGs/Deserter.rsi
    size: Large
    shape:
    - 0,0,6,2
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.85
        Piercing: 0.85
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
  - type: Gun
    fireRate: 10
    angleIncrease: 1.5
    angleDecay: 15
    projectileSpeed: 26
    minAngle: 10
    maxAngle: 20
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/c-20r.ogg
      params:
        volume: -2
  - type: NFWeaponDetails
    class: weapon-details-class-light-machine-gun
  - type: HeldSpeedModifier
    walkModifier: 0.4
    sprintModifier: 0.4
  - type: MultiHandedItem
  - type: AmmoCounter
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/lmg_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePackedLMGfilled
        insertSound: /Audio/Weapons/Guns/MagIn/lmg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/lmg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePackedLMG
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgePacked
        priority: 1
        whitelist:
          tags:
            - CartridgePacked
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 35000
  - type: UseDelay
    delay: 2