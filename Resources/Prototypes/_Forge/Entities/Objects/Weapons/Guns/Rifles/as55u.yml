- type: entity
  id: WeaponScrapRifleAssaultAS55U
  parent: [NFBaseWeaponRifleAssaultChamber, BaseC2ContrabandUnredeemable, NFBaseWeaponEncumbranceRifleAssault, NFBaseItemWeaponGunMagazineFed ]
  suffix: Scrap
  name: AS-55-U automatic carbine
  description: Modified version of AS-55, more firerate, low accuracy. Use .22,5 packed ammo.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Rifles/as-55u_icon_40x.rsi
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/Rifles/as-55u.rsi
  - type: Item
    sprite: Forge/Objects/Weapons/Guns/Rifles/as-55u.rsi
    size: Normal
    shape:
    - 0,0,3,1
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Gun
    fireRate: 4.5
    projectileSpeed: 25
    minAngle: 20
    maxAngle: 35
    selectedMode: FullAuto
    availableModes:
    - FullAuto
  - type: Wieldable
    unwieldOnUse: false
  - type: NFWeaponDetails
    class: weapon-details-class-assault-rifle
  - type: GunWieldBonus
    minAngle: -10
    maxAngle: -15
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePackedRiflefilled
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePackedRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgePacked
        priority: 1
        whitelist:
          tags:
            - CartridgePacked
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 1100