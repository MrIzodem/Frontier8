# Base
- type: entity
  name: ST infantry
  abstract: true
  parent:
  - NFMobNoEquipmentOnGib
  - MobMovementSpeedModifierMelee
  - MobStaminaFodder
  - BaseC3MobHuman
  - MobNonHumanHostileBase
  - MobHumanoidInvetorySimplified
  - MobHumanoidHostileAISimpleRanged
  id: MobScrapTechBase
  description: ...
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: Damageable
    damageModifierSet: MobMercenaryDamageModifierSet
  - type: NpcFactionMember
    factions:
    - MercenariesExpeditionNF
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      100: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      48: 0.7
      64: 0.5
  - type: DamageStateVisuals
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatRotten
      amount: 2
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2
    rechargeSound:
      path: /Audio/_NF/Effects/silence.ogg
  - type: Speech #CorvaxFrontier
    speechSounds: Alto
  - type: MeleeWeapon
    attackRate: 1.0
    altDisarm: false
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 12
        Structural: 20
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
      params:
        variation: 0.125
  - type: Advertise
    pack: mercenaryhumanoidchatter
    minimumWait: 30
    maximumWait: 120
    nextAdvertisementTime: 10
  - type: AutoWakeUp


# "Dust" troopers

# Tier 1

- type: entity
  name: scrap tech infantry
  parent: MobScrapTechBase
  id: MobScrapTechDT1Repeater
  description: Basic "dust" trooper, grabbed from civilians of 91-st sector.
# categories: [ HideSpawnMenu ]
  components:
  - type: Loadout
    prototypes:
    - MobHumanoidDScrapGearRangedRT1
  - type: Sprite
    drawdepth: Mobs
    layers:
    - sprite: _NF/Mobs/Species/Templates/human.rsi
      state: human
      color: "#f0af79" 
    - sprite: Forge/Clothing/Uniforms/Jumpsuits/scraprobe.rsi
      state: equipped-INNERCLOTHING
    - sprite: Forge/Clothing/Neck/Cloaks/scrapcloak.rsi
      state: equipped-NECK
    - sprite: Forge/Clothing/Head/Hoods/scrapcloak.rsi
      state: equipped-HELMET
  - type: BasicEntityAmmoProvider
    proto: NFCartridgeRifle20Overpressure
    capacity: 10
    count: 10
  - type: Gun
    showExamineText: false
    fireRate: 1.2
    minAngle: 8
    maxAngle: 20
    angleIncrease: 3
    angleDecay: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/ltrifle.ogg

