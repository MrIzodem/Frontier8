# Base
- type: entity
  name: ST infantry
  abstract: true
  categories: [ HideSpawnMenu ]
  parent:
  - NFMobNoEquipmentOnGib
  - MobStaminaFodder
  - MobNonHumanHostileBase
  - MobHumanoidInvetory
  - MobHumanoidHostileAISimpleRanged
  id: MobScrapTechBase
  description: ...
  components:
  - type: Damageable
    damageModifierSet: MobMercenaryDamageModifierSet
  - type: NpcFactionMember
    factions:
    - ScrapTechsTroopers
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      100: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      48: 0.7
      64: 0.5
  - type: DamageStateVisuals
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatRotten
      amount: 2
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.5
    rechargeSound:
      path: /Audio/_NF/Effects/silence.ogg
  - type: Speech
    speechSounds: Bass
  - type: MeleeWeapon
    attackRate: 2
    altDisarm: false
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 10
        Structural: 20
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
      params:
        variation: 0.125
  - type: Advertise
    pack: scraptechshumanoidchatter
    minimumWait: 30
    maximumWait: 120
    nextAdvertisementTime: 10
  - type: AutoWakeUp


# "Dust" troopers

# Tier 1

- type: entity
  name: scrap tech vagabound
  parent: MobScrapTechBase
  id: MobScrapTechDT1Repeater
  suffix: AI, Hostile, Common, T1
  description: Basic "dust trooper", grabbed from civilians of 91-st sector.
  components:
  - type: Loadout
    prototypes:
    - MobHumanoidDScrapGearRangedRT1
  - type: Sprite
    drawdepth: Mobs
    layers:
    - sprite: _NF/Mobs/Species/Templates/human.rsi
      state: human
    - sprite: Forge/Clothing/Uniforms/Jumpsuits/scraprobe.rsi
      state: equipped-INNERCLOTHING
    - sprite: Forge/Clothing/Neck/Cloaks/scrapcloak.rsi
      state: equipped-NECK
    - sprite: Forge/Clothing/Head/Hoods/scrapcloak.rsi
