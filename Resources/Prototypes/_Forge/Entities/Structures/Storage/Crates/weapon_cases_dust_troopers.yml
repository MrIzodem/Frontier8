- type: entity
  parent: ToolboxBase
  name: Dust Troopers armory crate
  id: WeaponCaseDustLong
  description: An old, wooden armory crate, he covered with dust...
  suffix: Long
  components:
  - type: Sprite
    sprite: Forge/Objects/Storage/guncasewoodlong.rsi
    layers:
    - map: [ base ]
      state: icon
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Item
    sprite: Forge/Objects/Storage/guncasewoodlong.rsi
    size: Large
    shape:
    - 0,0,5,3
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,3
    whitelist:
      components:
      - Gun
      - BallisticAmmoProvider
      - Projectile
      - CartridgeAmmo
      - PowerCell
      - MeleeWeapon
      - Blocking
      - WeaponCaseInsertable
      tags:
      - Cartridge

