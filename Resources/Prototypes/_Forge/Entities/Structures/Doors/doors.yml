# Tents by Forge-Nuclear-14

- type: entity
  parent: BaseMaterialDoor
  id: N14DoorTentflap
  name: tent flap
  suffix: smoothed tent
  description: A door for a tent.
  components:
  - type: Sprite
    netsync: false
    sprite: Forge/Structures/Doors/tentflap.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0.2
    closeTimeTwo: 0.2
    openTimeOne: 0.2
    openTimeTwo: 0.2
    openingAnimationTime: 0.2
    closingAnimationTime: 0.2
    openSound:
      path: /Audio/Effects/rustle5.ogg
    closeSound:
      path: /Audio/Items/zip.ogg
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Web
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialCloth1:
            min: 0
            max: 2

- type: entity
  parent: N14DoorTentflap
  id: N14DoorTentLeatherflap
  name: tent flap
  description: A door for a tent. Leathery.
  components:
  - type: Sprite
    netsync: false
    sprite: Forge/Structures/Doors/tentleather.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  parent: N14DoorTentflap
  id: N14DoorTentClothflap
  name: tent flap
  description: A door for a tent. Cloth.
  components:
  - type: Sprite
    netsync: false
    sprite: Forge/Structures/Doors/tentcloth.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]