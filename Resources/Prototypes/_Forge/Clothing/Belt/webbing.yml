- type: entity
  parent: [ NFClothingBeltStorageBase, NFBaseClothingBeltStorageBag ]
  id: ClothingBeltScrapTechSalvage
  name: Scrap Tech Salvage webbing
  suffix: DT/ST
  description: An old, heavy leather belt system with pockets who can carry ore and salvage instruments. This one have a broken magnet, so he attracts anything.
  components:
  - type: Sprite
    sprite: Forge/Clothing/Belt/scrap_webbing.rsi
  - type: Clothing
    sprite: Forge/Clothing/Belt/scrap_webbing.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: Storage
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,1,5
    - 3,0,8,3
    quickInsert: true
    areaInsert: true
  - type: Dumpable
  - type: NFOreBag
  - type: MagnetPickup
    magnetEnabled: false # Frontier
    magnetCanBeEnabled: false # Frontier
  - type: ItemToggle
    soundActivate: &soundActivate
      collection: sparks
      params:
        variation: 0.25
    soundDeactivate: *soundActivate
    onUse: false
    onAltUse: true
    onActivate: false
  - type: ItemToggleExamine
    on: item-toggle-examine-magnet-on
    off: item-toggle-examine-magnet-off
    
