  - type: Sprite
    sprite: Forge/Clothing/OuterClothing/Armor/tact_contractor.rsi
  - type: Clothing
    sprite: Forge/Clothing/OuterClothing/Armor/tact_contractor.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.3
        Heat: 0.8
  - type: StaminaResistance
    damageCoefficient: 0.5
  - type: ExplosionResistance
