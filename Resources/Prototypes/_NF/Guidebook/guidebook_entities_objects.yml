# Forge-Change: Remove bullet-trace state and color
- type: entity
  id: NFBulletGuidebook
  suffix: Guidebook
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Projectiles/bullets.rsi
    layers:
    - state: bullet
      shader: unshaded

